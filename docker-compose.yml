# ==================================================================================
# CONFIGURACIÓN DE SECRETOS - Se cargan desde .env
# ==================================================================================
# Las variables POSTGRES_PASSWORD, REDIS_PASSWORD, DB_PASS, SECRET_KEY, GRAFANA_PASSWORD
# deben estar definidas en un archivo .env antes de ejecutar docker compose up
#
# Para generar credenciales seguras automáticamente:
#   ./generate_secure_credentials.sh --force
#
# Despliegue simple:
#   docker compose up -d
# ==================================================================================

services:
  db:
    image: postgres:18-alpine
    container_name: rss2_db
    shm_size: 4gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rss}
      POSTGRES_USER: ${POSTGRES_USER:-rss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Europe/Madrid
      PGDATA: /var/lib/postgresql/data/18/main
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:rw
      - ./docker-entrypoint-db.sh:/docker-entrypoint-db.sh:ro
    entrypoint: ["bash", "/docker-entrypoint-db.sh"]
    networks:
      backend:
        aliases:
          - db
          - rss2_db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1" ]
      # NOTA: Si falla, verifica que POSTGRES_PASSWORD esté definido en .env
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: rss2_redis
    environment:
      TZ: Europe/Madrid
    # SEGURIDAD: Redis con autenticación
    command: >
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-!ERROR!REDIS_PASSWORD_NEEDED!}
    volumes:
      - ./data/redis-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      backend:
        aliases:
          - redis
          - rss2_redis
    restart: unless-stopped
    healthcheck:
      # VALIDACIÓN: Si REDIS_PASSWORD está vacío, esto fallará y detendrá el despliegue
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  rss-ingestor-go:
    build:
      context: ./rss-ingestor-go
      dockerfile: Dockerfile
    container_name: rss2_ingestor_go
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      RSS_MAX_WORKERS: ${RSS_MAX_WORKERS:-100}
      RSS_POKE_INTERVAL_MIN: ${RSS_POKE_INTERVAL_MIN:-60}
      RSS_HOST_DELAY_MS: ${RSS_HOST_DELAY_MS:-800}
      TZ: Europe/Madrid
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 512M

  langdetect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss2_langdetect_py
    command: bash -lc "python -m workers.langdetect_worker"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      LANG_DETECT_SLEEP: 60
      LANG_DETECT_BATCH: 1000
      TZ: Europe/Madrid
    volumes:
      - ./workers:/app/workers
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==================================================================================
  # SCRAPER WORKER (Go) - Extrae artículos de URLs
  # ==================================================================================
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: rss2_scraper
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      SCRAPER_SLEEP: 120
      SCRAPER_BATCH: 10
      SCRAPER_ENRICH_LIMIT: 10
      SCRAPER_WORKERS: ${SCRAPER_WORKERS:-2}
      TZ: Europe/Madrid
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ==================================================================================
  # DISCOVERY WORKER (Go) - Descubre RSS feeds
  # ==================================================================================
  discovery:
    build:
      context: .
      dockerfile: Dockerfile.discovery
    container_name: rss2_discovery
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      DISCOVERY_INTERVAL: 900
      DISCOVERY_BATCH: 10
      MAX_FEEDS_PER_URL: 5
      TZ: Europe/Madrid
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ==================================================================================
  # WIKI WORKER (Go) - Wikipedia info and thumbnails
  # ==================================================================================
  wiki-worker:
    build:
      context: .
      dockerfile: Dockerfile.wiki
    container_name: rss2_wiki_worker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      WIKI_SLEEP: 10
      WIKI_BATCH: 20
      TZ: Europe/Madrid
    volumes:
      - ./data/wiki_images:/app/data/wiki_images
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==================================================================================
  # BACKEND GO (API REST)
  # ==================================================================================
  backend-go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rss2_backend_go
    environment:
      TZ: Europe/Madrid
      DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rss}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-rss_redis_pass_2024}@redis:6379
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_long_random_string}
      SERVER_PORT: "8080"
    volumes:
      - ./data/wiki_images:/app/data/wiki_images
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  # ==================================================================================
  # FRONTEND REACT
  # ==================================================================================
  rss2_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rss2_frontend
    environment:
      TZ: Europe/Madrid
      VITE_API_URL: /api
    networks:
      - frontend
    depends_on:
      - backend-go
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ==================================================================================
  # NGINX (Puerto 8001 - sirve React + proxy API)
  # ==================================================================================
  nginx:
    image: nginx:alpine
    container_name: rss2_nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      - rss2_frontend
      - backend-go
    restart: unless-stopped

  # ==================================================================================
  # TRANSLATOR CPU (CTranslate2) - Scale with: docker compose up -d --scale translator=3
  # ==================================================================================
  translator:
    build:
      context: .
      dockerfile: Dockerfile.translator
    image: rss2-translator:latest
    command: bash -lc "python -m workers.ctranslator_worker"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      TARGET_LANGS: es
      TRANSLATOR_BATCH: ${TRANSLATOR_BATCH:-128}
      CT2_MODEL_PATH: /app/models/nllb-ct2
      CT2_DEVICE: cpu
      CT2_COMPUTE_TYPE: int8
      CT2_INTRA_THREADS: 4
      UNIVERSAL_MODEL: facebook/nllb-200-distilled-600M
      HF_HOME: /app/hf_cache
      TZ: Europe/Madrid
      TRANSLATOR_ID: ${TRANSLATOR_ID:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-rss_redis_pass_2024}@redis:6379
      PYTORCH_ENABLE_MPS_FALLBACK: 1
    volumes:
      - ./workers:/app/workers
      - ./hf_cache:/app/hf_cache
      - ./models:/app/models
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ==================================================================================
  # TRANSLATOR CPU Nº2 - Segundo worker CPU (paralelo al translator)
  # ==================================================================================
  translator-gpu:
    build:
      context: .
      dockerfile: Dockerfile.translator
    image: rss2-translator:latest
    command: bash -lc "python -m workers.ctranslator_worker"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      TARGET_LANGS: es
      TRANSLATOR_BATCH: ${TRANSLATOR_BATCH:-128}
      CT2_MODEL_PATH: /app/models/nllb-ct2
      CT2_DEVICE: cpu
      CT2_COMPUTE_TYPE: int8
      CT2_INTRA_THREADS: 4
      UNIVERSAL_MODEL: facebook/nllb-200-distilled-600M
      HF_HOME: /app/hf_cache
      TZ: Europe/Madrid
      TRANSLATOR_ID: ${TRANSLATOR_ID:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-rss_redis_pass_2024}@redis:6379
      PYTORCH_ENABLE_MPS_FALLBACK: 1
    volumes:
      - ./workers:/app/workers
      - ./hf_cache:/app/hf_cache
      - ./models:/app/models
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ==================================================================================
  # TRANSLATION SCHEDULER - Creates translation jobs
  # ==================================================================================
  translation-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: rss2-scheduler:latest
    container_name: rss2_translation_scheduler
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      TARGET_LANGS: es
      SCHEDULER_BATCH: 200
      SCHEDULER_AGE_DAYS: 30
      SCHEDULER_SLEEP: 30
      TZ: Europe/Madrid
    volumes:
      - ./workers:/app/workers
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  embeddings:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss2_embeddings_py
    command: bash -lc "python -m workers.embeddings_worker"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      EMB_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMB_BATCH: 32
      EMB_SLEEP_IDLE: 5
      EMB_LANGS: es
      EMB_LIMIT: 300
      DEVICE: cpu
      HF_HOME: /app/hf_cache
      TZ: Europe/Madrid
    volumes:
      - ./workers:/app/workers
      - ./hf_cache:/app/hf_cache
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 6G
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ==================================================================================
  # TOPICS WORKER (Go) - Matching temas y países
  # ==================================================================================
  topics:
    build:
      context: .
      dockerfile: Dockerfile.topics
    container_name: rss2_topics
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      TOPICS_SLEEP: 10
      TOPICS_BATCH: 500
      TZ: Europe/Madrid
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ==================================================================================
  # RELATED WORKER (Go) - Noticias relacionadas
  # ==================================================================================
  related:
    build:
      context: .
      dockerfile: Dockerfile.related
    container_name: rss2_related
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      RELATED_SLEEP: 10
      RELATED_BATCH: 200
      RELATED_TOPK: 10
      EMB_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      TZ: Europe/Madrid
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rss2_qdrant
    environment:
      TZ: Europe/Madrid
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          memory: 2G

  # ==================================================================================
  # QDRANT WORKER (Go) - Vectorización y búsqueda semántica
  # ==================================================================================
  qdrant-worker:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    container_name: rss2_qdrant_worker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: news_vectors
      OLLAMA_URL: http://ollama:11434
      QDRANT_SLEEP: 30
      QDRANT_BATCH: 100
      TZ: Europe/Madrid
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ==================================================================================
  # NER WORKER (Python) - Extracción de entidades
  # ==================================================================================
  ner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss2_ner
    command: bash -lc "python -m workers.ner_worker"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      NER_LANG: es
      NER_BATCH: 24
      HF_HOME: /app/hf_cache
      TZ: Europe/Madrid
    volumes:
      - ./workers:/app/workers
      - ./hf_cache:/app/hf_cache
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ==================================================================================
  # CLUSTER WORKER (Python) - Agrupación de noticias
  # ==================================================================================
  cluster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss2_cluster_py
    command: bash -lc "python -m workers.cluster_worker"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rss}
      DB_USER: ${DB_USER:-rss}
      DB_PASS: ${DB_PASS}
      EVENT_DIST_THRESHOLD: 0.35
      EMB_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      TZ: Europe/Madrid
    volumes:
      - ./workers:/app/workers
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ==================================================================================
  # REDES SEGMENTADAS
  # ==================================================================================
networks:
  # Red frontal - Solo nginx y web app
  frontend:
    name: rss2_frontend
    driver: bridge
    internal: false

  # Red backend - Base de datos, workers, redis, qdrant
  backend:
    name: rss2_backend
    driver: bridge
    internal: false # Acceso externo permitido (necesario para ingestor)

volumes:
  torch_extensions:
