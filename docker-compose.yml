# ==================================================================================
# RSS2 - Configuración Unificada (Go Puro + Servicios Externos)
# ==================================================================================
# Variables requeridas en .env:
# POSTGRES_PASSWORD, REDIS_PASSWORD, DB_PASS, SECRET_KEY, GRAFANA_PASSWORD
# ==================================================================================

services:
  # ------------------------------------------------------------------------------
  # BASE DE DATOS Y CACHE
  # ------------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: rss2_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rss}
      POSTGRES_USER: ${POSTGRES_USER:-rss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: rss2_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------------------
  # SERVICIOS EXTERNOS (GPU/ML) - Se mantienen fuera de Go
  # ------------------------------------------------------------------------------
  # Traductor NLLB-200 (CTranslate2) - CPU
  translator:
    build:
      context: ./translator
      dockerfile: Dockerfile.cpu
    container_name: rss2_translator
    healthcheck:
      test: ["CMD-SHELL", "grep -q ctranslator /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    environment:
      CT2_MODEL_PATH: /models/nllb-ct2
      CT2_DEVICE: cpu
      CT2_COMPUTE_TYPE: int8
      CT2_INTRA_THREADS: 2
      TRANSLATOR_ID: "0"
      TRANSLATOR_TOTAL: "2"
      PORT: 8000
      TARGET_LANGS: ${TARGET_LANGS:-es}
      TRANSLATOR_BATCH: ${TRANSLATOR_BATCH:-32}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./models:/models:ro
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Réplicas 2-3 del translator (paso 1 velocidad): reutilizan la imagen
  # ya construida; se reparten el trabajo por SKIP LOCKED en SQL.
  translator-2:
    image: rss2-translator
    container_name: rss2_translator_2
    healthcheck:
      test: ["CMD-SHELL", "grep -q ctranslator /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    environment:
      CT2_MODEL_PATH: /models/nllb-ct2
      CT2_DEVICE: cpu
      CT2_COMPUTE_TYPE: int8
      CT2_INTRA_THREADS: 2
      TRANSLATOR_ID: "1"
      TRANSLATOR_TOTAL: "2"
      PORT: 8000
      TARGET_LANGS: ${TARGET_LANGS:-es}
      TRANSLATOR_BATCH: ${TRANSLATOR_BATCH:-32}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./models:/models:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Traductor GPU (opcional, solo con --profile gpu y NVIDIA + nvidia-container-toolkit)
  translator-gpu:
    profiles: ["gpu"]
    build:
      context: ./translator
      dockerfile: Dockerfile.gpu
    container_name: rss2_translator_gpu
    environment:
      CT2_MODEL_PATH: /models/nllb-ct2
      CT2_DEVICE: cuda
      CT2_COMPUTE_TYPE: float16
      CT2_INTRA_THREADS: 4
      PORT: 8000
      TARGET_LANGS: ${TARGET_LANGS:-es}
      TRANSLATOR_BATCH: ${TRANSLATOR_BATCH:-32}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./models:/models:ro
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ------------------------------------------------------------------------------
  # INGESTA Y TRADUCCIÓN
  # ------------------------------------------------------------------------------
  # Ingestor RSS (Go): feeds -> noticias
  ingestor:
    build:
      context: ./rss-ingestor-go
    container_name: rss2_ingestor
    healthcheck:
      test: ["CMD-SHELL", "grep -q rss-ingestor /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      RSS_MAX_WORKERS: 20
      RSS_POKE_INTERVAL_MIN: 8
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Scheduler: noticias -> traducciones pendientes (las consume el translator)
  translation-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: rss2-pyworkers
    container_name: rss2_translation_scheduler
    healthcheck:
      test: ["CMD-SHELL", "grep -q translation_scheduler /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      TARGET_LANGS: ${TARGET_LANGS:-es}
      SCHEDULER_BATCH: 2000
      SCHEDULER_SLEEP: 30
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Langdetect: noticias.lang (lo necesita el scheduler para encolar traducciones)
  langdetect:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: rss2-pyworkers
    container_name: rss2_langdetect
    command: ["python", "workers/langdetect_worker.py"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q langdetect /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # NER (spaCy es_core_news_lg sobre traducciones done): tags -> Populares/Evolución/Alertas
  ner:
    build:
      context: .
      dockerfile: Dockerfile.ner
    container_name: rss2_ner
    healthcheck:
      test: ["CMD-SHELL", "grep -q ner_worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      NER_LANG: es
      NER_BATCH: 64
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Wiki: enriquece tags (persona/organizacion) con resumen+imagen de Wikipedia.
  # Reutiliza la imagen backend (el binario /wiki-worker ya se compila en
  # backend/Dockerfile): evita el build con contexto raíz, que es muy pesado.
  wiki:
    image: rss2-backend
    container_name: rss2_wiki
    entrypoint: ["/wiki-worker"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q wiki-worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      WIKI_SLEEP: 10
      WIKI_BATCH: 20
    volumes:
      - ./data/wiki_images:/app/data/wiki_images
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Topics: clasifica noticias (news_topics) y puebla noticias.pais_id
  # Reutiliza la imagen backend (sin build: evita el conflicto AlreadyExists
  # de construir dos servicios contra el mismo tag en un solo comando).
  topics:
    image: rss2-backend
    container_name: rss2_topics
    entrypoint: ["/topics"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      TOPICS_SLEEP: 10
      TOPICS_BATCH: 500
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q topics /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Embeddings locales (sentence-transformers, CPU): traducciones done
  # → traduccion_embeddings. Sustituto del Ollama retirado; alimenta a
  # related (coseno SQL). Modelo pre-descargado en ./hf_cache.
  embeddings:
    build:
      context: .
      dockerfile: Dockerfile.embeddings
    container_name: rss2_embeddings
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      EMB_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMB_BATCH: 128
      EMB_LANGS: es
      EMB_LIMIT: 1000
      DEVICE: cpu
    volumes:
      - ./hf_cache:/cache
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "grep -q embeddings_worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  # Related: noticias relacionadas por coseno (CPU) sobre embeddings locales.
  # EMB_MODEL debe coincidir con el del servicio embeddings.
  related:
    image: rss2-backend
    container_name: rss2_related
    entrypoint: ["/related"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      RELATED_SLEEP: 30
      RELATED_BATCH: 200
      RELATED_TOPK: 10
      EMB_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q related /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Scraper: completa resumen<200 y explora fuentes_url activas.
  # Sin fuentes_url sembradas solo hace enriquecimiento (también útil).
  scraper:
    image: rss2-backend
    container_name: rss2_scraper
    entrypoint: ["/scraper"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      SCRAPER_INTERVAL: 60
      SCRAPER_WORKERS: 5
      SCRAPER_BATCH: 10
      SCRAPER_ENRICH_LIMIT: 20
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q scraper /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Discovery: fuentes_url → feeds (directos si hay categoria+pais,
  # si no a feeds_pending para revisión). Dedupe por ON CONFLICT(url).
  discovery:
    image: rss2-backend
    container_name: rss2_discovery
    entrypoint: ["/discovery"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-rss}
      DB_USER: ${POSTGRES_USER:-rss}
      DB_PASS: ${POSTGRES_PASSWORD}
      DISCOVERY_INTERVAL: 900
      DISCOVERY_BATCH: 10
      MAX_FEEDS_PER_URL: 5
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -q discovery /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ------------------------------------------------------------------------------
  # BACKEND UNIFICADO (Go) - Un solo binario, múltiples subcomandos
  # ------------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rss2_backend
    command: server
    environment:
      TZ: Europe/Madrid
      DATABASE_URL: postgres://${POSTGRES_USER:-rss}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rss}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY}
      SERVER_PORT: "8080"
    volumes:
      - ./data/wiki_images:/app/data/wiki_images
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  # ------------------------------------------------------------------------------
  # FRONTEND (React + Vite)
  # ------------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rss2_frontend
    environment:
      VITE_API_URL: /api
    networks:
      - frontend
    depends_on:
      - backend
    restart: unless-stopped

  # ------------------------------------------------------------------------------
  # NGINX (Gateway - Puerto 8888)
  # ------------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: rss2_nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ------------------------------------------------------------------------------
  # MONITOREO (Opcional - activar con profile monitoring)
  # ------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: rss2_prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rss2_grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./data/grafana:/var/lib/grafana
    networks:
      - backend
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: rss2_cadvisor
    profiles: ["monitoring"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - backend
    restart: unless-stopped

# ------------------------------------------------------------------------------
# REDES
# ------------------------------------------------------------------------------
networks:
  frontend:
    name: rss2_frontend
    driver: bridge
  backend:
    name: rss2_backend
    driver: bridge