user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript 
               application/json application/javascript 
               application/xml text/xml;

    # Upstream for Go API
    #
    # NO se usa 'upstream backend:8080' con proxy_pass directo: nginx resuelve
    # el nombre UNA vez al arrancar y se queda con esa IP para siempre. Si el
    # contenedor del backend se recrea (o cambia de IP tras un reinicio del
    # host), nginx sigue hablando con la IP antigua y devuelve 404 de otro
    # servicio. Con una variable en proxy_pass, nginx resuelve en cada
    # peticion usando el resolver de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream for React Frontend
    upstream frontend {
        server rss2_frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_body_timeout 60s;
        client_header_timeout 60s;
        send_timeout 300s;

        # Serve React Frontend
        location / {
            set $frontend_upstream rss2_frontend:80;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy to Go API
        location /api/ {
            set $api_upstream backend:8080;
            # Con variables en proxy_pass hay que pasar la URI original
            # explicitamente: si no, nginx envia "/api/" tal cual y el
            # backend responde 404.
            proxy_pass http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "ok";
        }

        # Block sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
