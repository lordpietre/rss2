<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .meta {
            color: #7f8c8d;
            font-size: 12px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .meta span {
            margin-right: 15px;
        }

        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }

        img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 4px;
        }

        .content {
            font-size: 14px;
            text-align: justify;
        }

        .footer {
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 10px;
            color: #999;
            text-align: center;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>{{ titulo }}</h1>

    <div class="meta">
        <span>📅 {{ fecha }}</span>
        <span>📰 {{ fuente }}</span>
        {% if categoria %}<span>🏷️ {{ categoria }}</span>{% endif %}
    </div>

    {% if imagen_url %}
    <div class="image-container">
        <img src="{{ imagen_url }}" alt="Imagen noticia">
    </div>
    {% endif %}

    <div class="content">
        {{ resumen | safe }}
    </div>

    <div class="footer">
        <p>Generado por The Daily Feed - <a href="{{ url }}">Leer original</a></p>
    </div>
</body>

</html>
