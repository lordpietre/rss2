# Remote Translation Workers
# Ejecutar en un host separado:
#   docker compose -f docker-compose.remote.yml up -d

services:
  remote-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss2_remote_worker_1
    environment:
      WORKER_NAME: "remote-worker-1"
      WORKER_API_KEY: "${WORKER_API_KEY_1}"
      WORKER_SERVER: "ws://${BACKEND_HOST}:8080/ws/worker"
      CT2_DEVICE: cpu
      CT2_COMPUTE_TYPE: int8
      MAX_SRC_TOKENS: 2048
      MAX_NEW_TOKENS: 2048
      MAX_BODY_CHARS: 80000
      BODY_CHARS_CHUNK: 2000
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G

  remote-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss2_remote_worker_2
    environment:
      WORKER_NAME: "remote-worker-2"
      WORKER_API_KEY: "${WORKER_API_KEY_2}"
      WORKER_SERVER: "ws://${BACKEND_HOST}:8080/ws/worker"
      CT2_DEVICE: cpu
      CT2_COMPUTE_TYPE: int8
      MAX_SRC_TOKENS: 2048
      MAX_NEW_TOKENS: 2048
      MAX_BODY_CHARS: 80000
      BODY_CHARS_CHUNK: 2000
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G

networks:
  default:
    name: rss2_remote
