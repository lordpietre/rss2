# ==================================================================================
# Remote Worker Docker Compose
# ==================================================================================
# Este archivo permite ejecutar workers remotos de forma independiente.
# No requiere el servidor RSS2 completo, solo conexión a su endpoint WebSocket.
#
# Uso:
#   WORKER_API_KEY="tu-api-key" WORKER_SERVER="wss://tu-servidor.com/ws/worker" \
#   docker compose up -d
#
# O con archivo .env:
#   cp .env.example .env
#   # Editar .env con tus valores
#   docker compose up -d
# ==================================================================================

services:
  # ------------------------------------------------------------------------------
  # Remote Worker GPU (para máquinas con NVIDIA GPU)
  # ------------------------------------------------------------------------------
  remote-worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: rss2-remote-worker:latest
    container_name: rss2-remote-worker-gpu
    environment:
      # === REQUERIDO: Configura estas variables ===
      WORKER_API_KEY: "${WORKER_API_KEY}"
      WORKER_SERVER: "${WORKER_SERVER:-ws://localhost:8080/ws/worker}"
      
      # === OPCIONAL: Personalización ===
      WORKER_NAME: "${WORKER_NAME:-gpu-worker-1}"
      CT2_DEVICE: "${CT2_DEVICE:-cuda}"
      CT2_COMPUTE_TYPE: "${CT2_COMPUTE_TYPE:-float16}"
      CT2_MODEL_PATH: /app/models/nllb-ct2
      UNIVERSAL_MODEL: "${UNIVERSAL_MODEL:-facebook/nllb-200-1.3B}"
    volumes:
      - ./models:/app/models
      - ./hf_cache:/app/hf_cache
    # Solo activa este profile para workers GPU
    profiles:
      - gpu
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - external

  # ------------------------------------------------------------------------------
  # Remote Worker CPU (para máquinas sin GPU o testing)
  # ------------------------------------------------------------------------------
  remote-worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: rss2-remote-worker:latest
    container_name: rss2-remote-worker-cpu
    environment:
      # === REQUERIDO: Configura estas variables ===
      WORKER_API_KEY: "${WORKER_API_KEY}"
      WORKER_SERVER: "${WORKER_SERVER:-ws://localhost:8080/ws/worker}"
      
      # === OPCIONAL: Personalización ===
      WORKER_NAME: "${WORKER_NAME:-cpu-worker-1}"
      CT2_DEVICE: "cpu"
      CT2_COMPUTE_TYPE: "${CT2_COMPUTE_TYPE:-int8}"
      CT2_MODEL_PATH: /app/models/nllb-ct2
      UNIVERSAL_MODEL: "${UNIVERSAL_MODEL:-facebook/nllb-200-1.3B}"
    volumes:
      - ./models:/app/models
      - ./hf_cache:/app/hf_cache
    # Solo activa este profile para workers CPU
    profiles:
      - cpu
    restart: unless-stopped
    networks:
      - external

networks:
  external:
    external: true
